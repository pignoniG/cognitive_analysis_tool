[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cwtool"
version = "2.0.0.dev0"
description = "Luminance-compensated pupillometry for cognitive workload estimation"
readme = "ReadME.md"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }
authors = [{ name = "Giovanni Pignoni" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "opencv-python>=4.8",
    "av>=12",          # fast threaded decoding; OpenCV is used when it is missing
    "msgpack>=1.0",    # Pupil Core camera intrinsics
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
gui = ["PySide6>=6.5", "pyqtgraph>=0.13", "matplotlib>=3.7"]
logger = ["pyserial>=3.5", "pyshimmer>=0.6", "pylsl>=1.16", "PySide6>=6.5", "pyqtgraph>=0.13",
          "pyobjc-framework-IOBluetooth>=10; sys_platform == 'darwin'"]
dev = ["pytest>=7"]

[project.scripts]
cwtool = "cwtool.cli:main"
cwtool-gui = "cwtool.gui:main"
cwtool-logger = "cwtool.logger.gui:main"

[tool.setuptools.packages.find]
include = ["cwtool*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
