[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cwtool"
version = "2.0.0.dev0"
description = "Luminance-compensated pupillometry for cognitive workload estimation"
readme = "ReadME.md"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }
authors = [{ name = "Giovanni Pignoni" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "opencv-python>=4.8",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
gui = ["PySide6>=6.5", "pyqtgraph>=0.13", "matplotlib>=3.7"]
dev = ["pytest>=7"]

[project.scripts]
cwtool = "cwtool.cli:main"
cwtool-gui = "cwtool.gui:main"

[tool.setuptools.packages.find]
include = ["cwtool*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
